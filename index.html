<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pour Baby ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="hearts"></div>

<!-- PAGE D'ACCUEIL -->

<section id="welcome">

<div class="overlay"></div>

<img src="background.jpg" class="background">

<div class="center">

<h1>💌</h1>

<h2>Une lettre pour Baby</h2>

<p>J'ai quelque chose à te demander...</p>

<button id="openLetter">
Ouvrir ❤️
</button>

</div>

</section>

<!-- LETTRE -->

<section id="letterPage">

<div class="letter">

<h1>Pour Baby ❤️</h1>

<p id="typing"></p>

<div class="buttons">

<button id="yesBtn">

Ouiii ❤️

</button>

<button id="noBtn">

Non

</button>

</div>

</div>

</section>

<!-- DATE -->

<section id="datePage">

<h1>🥹</h1>

<h2>Tu m'as rendu super heureuse ❤️</h2>

<img src="together.jpg" class="photo">

<div class="form">

<label>

📅 Choisis une date

</label>

<input type="date" id="date">

<label>

🕒 Choisis une heure

</label>

<input type="time" id="time">

<label>

💌 Un petit message ? (facultatif)

</label>

<textarea id="message" rows="5"></textarea>

<button id="send">

Valider ❤️

</button>

</div>

</section>

<!-- FIN -->

<section id="finalPage">

<h1>❤️ Merci Baby ❤️</h1>

<img src="images/together.jpg" class="photoFinal">

<p>

J'ai tellement hâte de partager ce moment avec toi 🥹

</p>

<div class="love">

❤️ ❤️ ❤️

</div>

</section>

<script src="script.js"></script>

</body>

</html>
