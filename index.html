<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pour Baby ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Parisienne&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Cœurs -->

<div id="hearts"></div>

<!-- ========================= -->
<!-- PAGE 1 -->
<!-- ========================= -->

<section id="welcome">

<img src="background.jpg" class="background">

<div class="overlay"></div>

<div class="welcomeCard">

<div class="mail">

💌

</div>

<h1>Pour Baby ❤️</h1>

<p>

J'ai préparé une petite surprise...

</p>

<button id="openLetter">

Ouvrir la lettre

</button>

</div>

</section>

<!-- ========================= -->
<!-- PAGE 2 -->
<!-- ========================= -->

<section id="letterPage">

<div class="letter">

<h2>Pour Baby ❤️</h2>

<p id="typing"></p>

<div class="buttons">

<button id="yesBtn">

Ouiii ❤️

</button>

<button id="noBtn">

Non 😶

</button>

</div>

</div>

</section>

<!-- ========================= -->
<!-- PAGE 3 -->
<!-- ========================= -->

<section id="datePage">

<div class="card">

<h2>

🥹 Tu as accepté ❤️

</h2>

<img src="together.jpg" class="photo">

<label>

📅 Choisis une date

</label>

<select id="date">

<option value="">-- Choisir --</option>

<option value="2 août">2 août</option>

<option value="8 août">8 août</option>

<option value="9 août">9 août</option>

</select>

<label>

🕒 Choisis une heure

</label>

<select id="time">

<option value="">-- Choisir --</option>

<option>15h00</option>
<option>15h30</option>
<option>16h00</option>
<option>16h30</option>
<option>17h00</option>
<option>17h30</option>
<option>18h00</option>
<option>18h30</option>
<option>19h00</option>

</select>

<label>

💌 Un petit mot ? (facultatif)

</label>

<textarea id="message" rows="5"></textarea>

<button id="send">

Valider ❤️

</button>

</div>

</section>

<!-- ========================= -->
<!-- PAGE 4 -->
<!-- ========================= -->

<section id="finalPage">

<div class="cardFinal">

<h1>

❤️ Merci Baby ❤️

</h1>

<img src="together.jpg" class="photoFinal">

<p>

J'ai tellement hâte de partager ce moment avec toi 🥹❤️

</p>

<div class="love">

❤️ ❤️ ❤️

</div>

</div>

</section>

<!-- EmailJS -->

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>

emailjs.init({

publicKey: "Vpel2jP4va1Jcl3N-"

});

</script>

<script src="script.js"></script>

</body>

</html>
